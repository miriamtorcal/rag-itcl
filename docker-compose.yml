services:
  mcp_server:
    build:
      context: ./mcp_server
    container_name: mcp_server
    ports:
      - "8000:8000"
    networks:
      - rag_net

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rag_client
    ports:
      - "8501:8501"
    depends_on:
      ollama:
        condition: service_healthy
      mcp_server:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./client:/app/client
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - MCP_URL=http://mcp_server:8000/sse
      - PYTHONPATH=/app
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge

volumes:
  ollama_data: